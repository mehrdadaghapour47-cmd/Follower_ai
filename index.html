<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b12">
<title>Follower AI</title>

<style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:#070b12;
  color:#fff;
  font-family:Arial,sans-serif;
}

.app{
  max-width:700px;
  margin:auto;
  padding:14px;
}

header{
  text-align:center;
  padding:25px 0 20px;
}

.logo{
  font-size:52px;
}

h1{
  margin:6px 0;
  font-size:31px;
}

.sub{
  color:#9ba6ba;
  font-size:14px;
}

.card{
  background:#111827;
  border:1px solid #273349;
  border-radius:18px;
  padding:18px;
  margin:14px 0;
}

h2{
  margin:0 0 16px;
  font-size:19px;
}

label{
  display:block;
  margin:12px 0 7px;
  color:#cbd5e1;
}

input,
select{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #334155;
  background:#0b1220;
  color:#fff;
  font-size:15px;
  outline:none;
}

input:focus,
select:focus{
  border-color:#ff6900;
}

button{
  width:100%;
  padding:14px;
  margin-top:16px;
  border:0;
  border-radius:11px;
  background:#ff6900;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:wait;
}

.result{
  margin-top:16px;
  line-height:2;
  color:#e2e8f0;
}

.item{
  background:#0b1220;
  border-radius:12px;
  padding:14px;
  margin:9px 0;
  overflow-wrap:anywhere;
}

.stat{
  display:inline-block;
  width:48%;
  margin:1%;
  padding:14px;
  background:#0b1220;
  border-radius:12px;
  text-align:center;
}

.small{
  color:#94a3b8;
  font-size:12px;
}

.tag{
  display:inline-block;
  padding:5px 9px;
  margin:3px;
  background:#1e293b;
  border-radius:8px;
  font-size:13px;
}

.good{
  border-right:4px solid #22c55e;
}

.warn{
  border-right:4px solid #f59e0b;
}

.bad{
  border-right:4px solid #ef4444;
}

.loading{
  text-align:center;
  padding:20px;
}

footer{
  text-align:center;
  color:#64748b;
  font-size:12px;
  padding:20px 0;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">🔥</div>
  <h1>Follower AI</h1>
  <div class="sub">دستیار هوشمند رشد پیج اینستاگرام</div>
</header>

<div class="card">

<h2>🎯 تحلیل پیج</h2>

<label for="niche">موضوع پیج</label>

<input
  id="niche"
  type="text"
  placeholder="مثلاً آتش نشانی + بدنسازی"
>

<label for="followers">تعداد فالوور</label>

<input
  id="followers"
  type="number"
  min="0"
  placeholder="مثلاً 2126"
>

<label for="goal">هدف اصلی</label>

<select id="goal">
  <option>افزایش فالوور هدفمند</option>
  <option>افزایش بازدید ریلز</option>
  <option>افزایش تعامل</option>
  <option>ساخت برند شخصی</option>
</select>

<button
  id="analyzePageButton"
  onclick="analyzePage()"
>
🚀 ساخت استراتژی با هوش مصنوعی
</button>

<div id="pageResult" class="result"></div>

</div>


<div class="card">

<h2>🧠 مخاطب هدف</h2>

<div id="audience" class="result">
بعد از تحلیل پیج نمایش داده می‌شود.
</div>

</div>


<div class="card">

<h2>🔥 ایده‌های ریلز</h2>

<div id="ideas" class="result">
بعد از تحلیل پیج نمایش داده می‌شود.
</div>

</div>


<div class="card">

<h2>📅 برنامه محتوایی ۷ روزه</h2>

<div id="plan" class="result">
بعد از تحلیل پیج نمایش داده می‌شود.
</div>

</div>


<div class="card">

<h2>📊 تحلیل ریلز</h2>

<label for="views">بازدید</label>

<input
  id="views"
  type="number"
  min="0"
  placeholder="3000"
>

<label for="likes">لایک</label>

<input
  id="likes"
  type="number"
  min="0"
  placeholder="150"
>

<label for="comments">کامنت</label>

<input
  id="comments"
  type="number"
  min="0"
  placeholder="20"
>

<label for="shares">اشتراک‌گذاری</label>

<input
  id="shares"
  type="number"
  min="0"
  placeholder="10"
>

<label
